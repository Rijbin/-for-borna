<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rijbin ♡ Borna</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Trebuchet MS",Arial,sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(circle at 15% 15%,#ffc1df,transparent 30%),
        radial-gradient(circle at 85% 85%,#cbb9ff,transparent 32%),
        #fff5fa;

    perspective:1200px;
}

/* Floating hearts */

.hearts span{
    position:absolute;
    bottom:-40px;
    color:#ff8fbd;
    font-size:20px;
    opacity:0;
    animation:heartFloat 8s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s}
.hearts span:nth-child(2){left:28%;animation-delay:2s}
.hearts span:nth-child(3){left:50%;animation-delay:4s}
.hearts span:nth-child(4){left:72%;animation-delay:1s}
.hearts span:nth-child(5){left:90%;animation-delay:3s}

@keyframes heartFloat{
    0%{
        transform:translateY(0) scale(.5) rotate(0);
        opacity:0;
    }

    20%{
        opacity:.7;
    }

    100%{
        transform:translateY(-110vh) scale(1.5) rotate(25deg);
        opacity:0;
    }
}

/* Main */

.wrapper{
    width:90%;
    max-width:400px;
    z-index:5;
}

.card{
    position:relative;
    padding:42px 26px;
    text-align:center;

    border-radius:40px;

    background:rgba(255,255,255,.45);

    border:1px solid rgba(255,255,255,.85);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    box-shadow:
        0 30px 80px rgba(180,100,150,.25),
        inset 0 1px 3px white;

    transform-style:preserve-3d;
    transition:transform .15s ease;
}

/* Couple name */

.couple{
    font-size:30px;
    font-weight:bold;
    letter-spacing:1px;

    color:#7c5a70;

    transform:translateZ(65px);
}

.couple .heart{
    color:#ff659f;

    display:inline-block;

    animation:beat 1.5s infinite;
}

@keyframes beat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.2);
    }
}

/* Icon */

.icon{
    width:95px;
    height:95px;

    margin:25px auto 0;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:30px;

    font-size:43px;

    background:
        linear-gradient(
            145deg,
            #ffb2d5,
            #d7b9ff
        );

    box-shadow:
        10px 15px 30px rgba(190,120,170,.25),
        inset 4px 4px 10px rgba(255,255,255,.7),
        inset -5px -5px 10px rgba(160,100,180,.15);

    transform:translateZ(75px);

    animation:iconFloat 3s ease-in-out infinite;
}

@keyframes iconFloat{
    0%,100%{
        transform:translateZ(75px) translateY(0);
    }

    50%{
        transform:translateZ(95px) translateY(-8px);
    }
}

/* Title */

h1{
    margin-top:25px;

    font-size:25px;

    color:#8b6279;

    transform:translateZ(50px);
}

/* Message */

.message{
    margin-top:20px;

    font-size:16px;

    line-height:2;

    color:#765d6c;

    transform:translateZ(40px);
}

.message span{
    display:block;

    opacity:0;

    animation:show .7s ease forwards;
}

.message span:nth-child(1){animation-delay:.2s}
.message span:nth-child(2){animation-delay:.5s}
.message span:nth-child(3){animation-delay:.8s}
.message span:nth-child(4){animation-delay:1.1s}
.message span:nth-child(5){animation-delay:1.4s}
.message span:nth-child(6){animation-delay:1.7s}
.message span:nth-child(7){animation-delay:2s}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Names inside */

.from{
    margin-top:22px;

    font-size:13px;

    color:#a48596;

    letter-spacing:1px;

    transform:translateZ(30px);
}

.from b{
    color:#e35f99;
}

/* Button */

.button{
    display:inline-block;

    margin-top:23px;

    padding:13px 30px;

    border-radius:50px;

    text-decoration:none;

    color:white;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff8fbd,
            #b795ff
        );

    box-shadow:
        0 10px 25px rgba(210,120,180,.25),
        inset 0 1px 2px rgba(255,255,255,.7);

    transform:translateZ(50px);

    transition:.3s;
}

.button:hover{
    transform:translateZ(70px) scale(1.06);
}

.footer{
    margin-top:22px;

    font-size:10px;

    letter-spacing:2px;

    color:#b398a7;

    transform:translateZ(20px);
}
</style>
</head>

<body>

<div class="hearts">
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
    <span>♥</span>
    <span>♡</span>
</div>

<div class="wrapper">

    <div class="card" id="card">

        <div class="couple">
            Rijbin <span class="heart">♡</span> Borna
        </div>

        <div class="icon">
            🎀
        </div>

        <h1>Just For You, Borna ♡</h1>

        <div class="message">

            <span>You cute ♡</span>

            <span>You pretty ✨</span>

            <span>You adorable 🎀</span>

            <span>You attractive 🫧</span>

            <span>You smart 🪽</span>

            <span>You sweet 🌷</span>

            <span style="color:#e45c98;font-weight:bold;">
                You mine &lt;3
            </span>

        </div>

        <div class="from">
            From <b>Rijbin</b> ♡ for <b>Borna</b>
        </div>

        <a href="#" class="button">
            ♡
        </a>

        <div class="footer">
            RIJBIN × BORNA
        </div>

    </div>

</div>

<script>

const card=document.getElementById("card");

/* Desktop 3D */

document.addEventListener("mousemove",(e)=>{

    const x=
        (window.innerWidth/2-e.clientX)/30;

    const y=
        (window.innerHeight/2-e.clientY)/30;

    card.style.transform=
        `rotateY(${x}deg) rotateX(${-y}deg)`;
});

/* Reset */

document.addEventListener("mouseleave",()=>{

    card.style.transform=
        "rotateY(0deg) rotateX(0deg)";
});

/* Mobile */

document.addEventListener("touchmove",(e)=>{

    const touch=e.touches[0];

    const x=
        (window.innerWidth/2-touch.clientX)/35;

    const y=
        (window.innerHeight/2-touch.clientY)/35;

    card.style.transform=
        `rotateY(${x}deg) rotateX(${-y}deg)`;
});

document.addEventListener("touchend",()=>{

    card.style.transform=
        "rotateY(0deg) rotateX(0deg)";
});

</script>

</body>
</html>
